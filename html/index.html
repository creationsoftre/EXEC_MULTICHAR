<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multicharacter</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div id="app" class="app hidden">
    <div class="app__backdrop"></div>
    <div class="app__shell">
      <header class="app__header">
        <div class="app__title">
          <h1>Character Selection</h1>
          <p id="statusText">Pick a character or create a new one.</p>
        </div>
        <div class="app__tips">
          <span class="tip">Scroll: Zoom</span>
          <span class="tip">A / D or Left Arrow / Right Arrow: Orbit</span>
          <span class="tip">Q / E: Camera Angle</span>
          <span class="tip">Z / X: Pose</span>
        </div>
      </header>

      <main class="app__content">
        <section class="cards" id="cardList"></section>
        <aside class="details" id="detailPanel">
          <h2 id="detailName">No Character Selected</h2>
          <div class="detail-grid" id="detailGrid">
            <div class="detail-row"><span>Citizen ID</span><strong id="detailId">--</strong></div>
            <div class="detail-row"><span>Gender</span><strong id="detailGender">--</strong></div>
            <div class="detail-row"><span>Date of Birth</span><strong id="detailDob">--</strong></div>
          </div>
          <div class="actions">
            <button id="btnPlay" class="btn primary" disabled>Play Character</button>
            <button id="btnDelete" class="btn danger" disabled>Delete</button>
            <button id="btnCreate" class="btn ghost">Create Character</button>
          </div>
        </aside>
      </main>
    </div>

    <div id="modalCreate" class="modal hidden">
      <form id="createForm" class="modal__content">
        <h2>Create Character</h2>
        <label>
          First Name
          <input type="text" name="firstname" maxlength="20" required>
        </label>
        <label>
          Last Name
          <input type="text" name="lastname" maxlength="20" required>
        </label>
        <label>
          Gender
          <select name="gender" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </label>
        <label>
          Date of Birth
          <input type="date" name="dob" value="2000-01-01" required>
        </label>
        <div class="modal__actions">
          <button type="button" class="btn ghost" id="btnCancelCreate">Cancel</button>
          <button type="submit" class="btn primary">Confirm</button>
        </div>
      </form>
    </div>

    <div id="modalDelete" class="modal hidden">
      <div class="modal__content">
        <h2>Delete Character</h2>
        <p id="deleteMessage">Are you sure you want to delete this character?</p>
        <div class="modal__actions">
          <button type="button" class="btn ghost" id="btnCancelDelete">Cancel</button>
          <button type="button" class="btn danger" id="btnConfirmDelete">Delete</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
